# One sidebar chat on grokbot1@gmail.com. Several topics open with a draft or
# pastoral ask, then pile on anaphoric follow-ups so multi-turn memory has to
# keep the prior notes/topic. Topic switches still appear between chains.
turns:
  - id: james_study
    kind: draft
    query: Write an in-depth Bible study on James 2
    expect_pipeline: study_sermon_draft
    must_mention:
      - James 2
    must_not_mention: []

  - id: study_followup_question
    kind: draft
    anaphoric: true
    query: Add a discussion question to that study
    expect_pipeline: study_sermon_draft
    must_mention:
      - James 2
    must_not_mention: []

  - id: study_followup_application
    kind: draft
    anaphoric: true
    query: Add a workplace application to those notes
    expect_pipeline: study_sermon_draft
    must_mention:
      - James 2
    must_not_mention: []

  - id: study_followup_shorten
    kind: draft
    anaphoric: true
    query: Shorten that study to one page
    expect_pipeline: study_sermon_draft
    must_mention:
      - James 2
    must_not_mention: []

  - id: study_followup_scripture
    kind: pastoral
    anaphoric: true
    query: Which scripture should I emphasize when I teach that?
    expect_pipeline: pastoral_chat
    must_mention:
      - James
    must_not_mention: []

  - id: forgiveness_sermon
