# Optional Compose overlay reflecting production model settings.
# On many RunPod images Docker cannot run — use install.sh native path instead.
services:
  vllm:
    image: vllm/vllm-openai:v0.8.5
    command: >
      --model Qwen/Qwen2.5-14B-Instruct-AWQ
      --served-model-name christianai
      --enable-lora
      --lora-modules christianai=/lora
      --max-lora-rank 16
      --max-model-len 8192
      --gpu-memory-utilization 0.90
      --trust-remote-code
      --host 0.0.0.0
      --port 8000
    volumes:
      - ${HF_CACHE:-./hf_cache}:/root/.cache/huggingface
      - ${CHRISTIANAI_LORA_DIR:-./christianai-lora}:/lora:ro
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    ports:
      - "127.0.0.1:8010:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: "8gb"
